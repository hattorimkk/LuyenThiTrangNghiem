name: Trigger Server change Static Web

on:
  push:
    branches: [ "main" ]

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin

      - name: Deploy to Server via SSH ProxyCommand
        run: |
          # 1. Chuẩn bị môi trường SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. Thực thi lệnh SSH
          ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
          
          # ===============================================================
          # CÁC LỆNH BÊN DƯỚI ĐÂY ĐANG CHẠY TRÊN SERVER DEBIAN CỦA BẠN
          # ===============================================================
          
          echo "✅ Connected to server successfully!"
          cd ${{ secrets.SERVER_PROJECT_PATH }}
          
          # Bây giờ 'git reset' sẽ thành công vì quyền đã đúng
          echo "⬇️ Force pulling latest code..."
          git fetch origin
          git reset --hard origin/main

          ENDSSH